name: WordPress ZIP und GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alowidat-plugin-release
  cancel-in-progress: false

jobs:
  package-release:
    name: Plugin prüfen, ZIP bauen und veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Quellcode abrufen
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Plugin testen und ZIP erstellen
        shell: bash
        run: bash tools/build-release.sh

      - name: Gutschein- und Rabattcode-Regressionsprüfungen
        shell: bash
        run: |
          set -euo pipefail
          for scenario in gift coupon coupon_with_gift remove_coupon_with_gift remove_gift_with_coupon invalid_coupon render_both fixed_cart_gift_protected fixed_cart_normal_ok; do
            php tests/test-checkout-codes.php "$scenario"
          done

      - name: Native Warenkorb- und Checkout-Gutscheinfelder prüfen
        shell: bash
        run: |
          set -euo pipefail
          for scenario in native_cart_gift native_cart_coupon native_cart_nonce_invalid native_cart_gift_only native_ajax_gift native_ajax_coupon native_ajax_blocked native_ajax_coupon_with_gift native_remove native_optional_hidden native_default_visible native_credit_row; do
            php tests/test-native-coupons.php "$scenario"
          done

      - name: Gutscheinkauf ohne Rabatte und bearbeitbare Hinweise prüfen
        shell: bash
        run: php tests/test-purchase-discounts.php

      - name: ZIP als GitHub Release veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat dist/VERSION)"
          tag="v${version}"
          file="dist/alowidat-geschenkgutscheine-v${version}.zip"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release ${tag} existiert bereits. Für Codeänderungen zuerst die Plugin-Versionsnummer, README und CHANGELOG erhöhen."
            exit 1
          fi

          gh release create "$tag" "$file" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Alowidat Geschenkgutscheine ${tag}" \
            --notes-file dist/RELEASE_NOTES.md \
            --latest

          echo "Release erstellt: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
